<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Soc Ops — Social Bingo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}"/>
    <style>
        /* active-state tweaks that need pseudo-class selectors */
        .tile-active:active { background-color: #f3f4f6 !important; }
        .accent-active:active { background-color: #3b82f6 !important; }

        /* ── Vaporwave Sunset lobby ─────────────────────────────── */
        #lobbyView {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--vw-sky-bottom);
            font-family: 'Courier New', Courier, monospace;
        }

        /* Layered sky gradient */
        #lobbyView::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                var(--vw-sky-top)    0%,
                var(--vw-sky-mid)   38%,
                var(--vw-horizon)   58%,
                var(--vw-sky-bottom) 100%
            );
            z-index: 0;
        }

        /* Retro sun disc */
        .vw-sun {
            position: absolute;
            bottom: 36%;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(140px, 32vw, 260px);
            height: clamp(70px, 16vw, 130px);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            background: linear-gradient(
                180deg,
                var(--vw-sun-top)    0%,
                var(--vw-sun-mid)   40%,
                var(--vw-sun-bot)  100%
            );
            z-index: 1;
            box-shadow: 0 0 60px 20px rgba(255, 100, 80, 0.35);
            /* horizontal scan-line slots cut into the sun */
            -webkit-mask-image: repeating-linear-gradient(
                180deg,
                black 0px, black 10px,
                transparent 10px, transparent 14px
            );
            mask-image: repeating-linear-gradient(
                180deg,
                black 0px, black 10px,
                transparent 10px, transparent 14px
            );
        }

        /* Grid horizon floor */
        .vw-floor {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 38%;
            z-index: 2;
            background:
                /* vertical lines */
                repeating-linear-gradient(
                    90deg,
                    transparent 0%, transparent calc(10% - 1px),
                    rgba(255, 0, 180, 0.4) calc(10% - 1px), rgba(255, 0, 180, 0.4) 10%
                ),
                /* horizontal lines (perspective-faked with spacing) */
                repeating-linear-gradient(
                    180deg,
                    transparent 0px, transparent 19px,
                    rgba(0, 240, 255, 0.35) 19px, rgba(0, 240, 255, 0.35) 20px,
                    transparent 20px, transparent 38px,
                    rgba(0, 240, 255, 0.25) 38px, rgba(0, 240, 255, 0.25) 39px,
                    transparent 39px, transparent 53px,
                    rgba(0, 240, 255, 0.18) 53px, rgba(0, 240, 255, 0.18) 54px,
                    transparent 54px, transparent 65px,
                    rgba(0, 240, 255, 0.12) 65px, rgba(0, 240, 255, 0.12) 66px
                ),
                linear-gradient(
                    180deg,
                    var(--vw-floor-top) 0%,
                    var(--vw-floor-bot) 100%
                );
        }

        /* Scanline film grain overlay */
        #lobbyView::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.04) 0px,
                rgba(0, 0, 0, 0.04) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* Content card sits above all layers */
        .vw-card {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 26rem;
            padding: 0 1.5rem;
        }

        /* Brand lockup */
        .vw-eyebrow {
            font-size: 0.7rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--vw-cyan);
            opacity: 0;
            animation: vw-slide-up 0.5s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
            text-shadow: 0 0 10px var(--vw-cyan);
        }

        .vw-title {
            font-size: clamp(3.5rem, 12vw, 6rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.02em;
            color: transparent;
            -webkit-text-stroke: 2px var(--vw-pink);
            background: linear-gradient(
                180deg,
                var(--vw-title-top) 0%,
                var(--vw-title-bot) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /* fallback for browsers without bg-clip */
            filter: drop-shadow(0 0 18px rgba(255, 0, 180, 0.5));
            margin: 0.25rem 0 0.1rem;
            opacity: 0;
            animation: vw-slide-up 0.55s cubic-bezier(0.22,1,0.36,1) 0.25s forwards;
        }

        .vw-subtitle {
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--vw-peach);
            margin-bottom: 2rem;
            opacity: 0;
            animation: vw-slide-up 0.5s cubic-bezier(0.22,1,0.36,1) 0.4s forwards;
        }

        /* How-to-play card */
        .vw-rules {
            width: 100%;
            background: rgba(10, 5, 30, 0.65);
            border: 1px solid rgba(255, 0, 180, 0.35);
            border-radius: 0.625rem;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            text-align: left;
            opacity: 0;
            animation: vw-fade-in 0.5s ease 0.55s forwards;
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.08);
        }

        .vw-rules h2 {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--vw-cyan);
            margin: 0 0 0.6rem;
            text-shadow: 0 0 8px var(--vw-cyan);
        }

        .vw-rules ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .vw-rules li {
            font-size: 0.8rem;
            color: rgba(220, 200, 255, 0.85);
            padding: 0.25rem 0;
        }

        .vw-rules li::before {
            content: '▸ ';
            color: var(--vw-pink);
        }

        /* CTA button */
        .vw-cta {
            display: block;
            width: 100%;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, var(--vw-pink) 0%, var(--vw-orange) 100%);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: vw-fade-in 0.5s ease 0.7s forwards;
            box-shadow: 0 4px 24px rgba(255, 0, 180, 0.45), 0 0 0 1px rgba(255,255,255,0.08) inset;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .vw-cta::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0);
            transition: background 0.15s ease;
        }

        .vw-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(255, 0, 180, 0.55), 0 0 0 1px rgba(255,255,255,0.12) inset;
        }

        .vw-cta:active {
            transform: translateY(0);
            box-shadow: 0 2px 12px rgba(255, 0, 180, 0.4);
        }

        .vw-cta:focus-visible {
            outline: 2px solid var(--vw-cyan);
            outline-offset: 3px;
        }

        /* Entrance keyframes */
        @keyframes vw-slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes vw-fade-in {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Reduced-motion: skip animations, keep styles */
        @media (prefers-reduced-motion: reduce) {
            .vw-eyebrow,
            .vw-title,
            .vw-subtitle,
            .vw-rules,
            .vw-cta {
                animation: none;
                opacity: 1;
            }
            .vw-cta:hover { transform: none; }
        }
    </style>
</head>
<body class="h-full">

<!-- ============================================================= -->
<!--  LOBBY — visible before a game starts                          -->
<!-- ============================================================= -->
<div id="lobbyView" aria-label="Lobby">

    <!-- decorative layers (aria-hidden) -->
    <div class="vw-sun"  aria-hidden="true"></div>
    <div class="vw-floor" aria-hidden="true"></div>

    <!-- content -->
    <div class="vw-card">
        <p class="vw-eyebrow">Edition 2025</p>
        <h1 class="vw-title">Soc&nbsp;Ops</h1>
        <p class="vw-subtitle">Social&nbsp;Bingo</p>

        <div class="vw-rules" aria-label="How to play">
            <h2>How to play</h2>
            <ul>
                <li>Find people who match the prompts</li>
                <li>Tap a square when you find a match</li>
                <li>Get 5 in a row to win!</li>
            </ul>
        </div>

        <button class="vw-cta" onclick="launchGame()">
            Start Game
        </button>
    </div>
</div>

<!-- ============================================================= -->
<!--  ACTIVE GAME — board, header, optional bingo banner            -->
<!-- ============================================================= -->
<div id="activeView" class="flex flex-col min-h-full bg-gray-50" style="display:none">

    <!-- top bar -->
    <header class="flex items-center justify-between p-3 bg-white border-b border-gray-200">
        <button onclick="retreatToLobby()"
                class="text-gray-500 text-sm px-3 py-1\.5 rounded tile-active">
            &#8592; Back
        </button>
        <h1 class="font-bold text-gray-900">Soc Ops</h1>
        <div class="w-16"></div>
    </header>

    <!-- hint -->
    <p class="text-center text-gray-500 text-sm py-2 px-4">
        Tap a square when you find someone who matches it.
    </p>

    <!-- bingo banner (hidden until victory) -->
    <div id="bingoBanner"
         class="bg-amber-100 text-amber-800 text-center py-2 font-semibold text-sm"
         style="display:none">
        &#127881; BINGO! You got a line!
    </div>

    <!-- the 5×5 grid -->
    <div class="flex-1 flex items-center justify-center p-3">
        <div id="gridContainer"
             class="grid grid-cols-5 gap-1 w-full max-w-md mx-auto aspect-square">
            <!-- tiles injected by JS -->
        </div>
    </div>
</div>

<!-- ============================================================= -->
<!--  VICTORY MODAL — overlays the board                            -->
<!-- ============================================================= -->
<div id="victoryOverlay"
     class="fixed inset-0 bg-black\/50 flex items-center justify-center p-4 z-50"
     style="display:none">
    <div class="bg-white rounded-xl p-6 max-w-xs w-full text-center shadow-xl animate-[bounce_0.5s_ease-out]">
        <div class="text-5xl mb-4">&#127881;</div>
        <h2 class="text-3xl font-bold text-amber-500 mb-2">BINGO!</h2>
        <p class="text-gray-600 mb-6">You completed a line!</p>
        <button onclick="dismissVictoryModal()"
                class="w-full bg-accent text-white font-semibold py-3 px-6 rounded-lg accent-active transition-colors">
            Keep Playing
        </button>
    </div>
</div>

<!-- ============================================================= -->
<!--  Client-side game engine                                       -->
<!-- ============================================================= -->
<script>
(function () {
    "use strict";

    var SIDE = 5;
    var TOTAL_CELLS = SIDE * SIDE;
    var PERSIST_KEY = "socops-bingo-snapshot";

    /* ── state ────────────────────────────────────────────────── */
    var liveTiles   = [];          /* Array of BingoCell objects  */
    var streakFound = null;        /* WinningStreak or null       */
    var modalShown  = false;
    var currentPhase = "LOBBY";    /* LOBBY | ACTIVE | VICTORY    */

    /* ── DOM refs ─────────────────────────────────────────────── */
    var lobbyDiv   = document.getElementById("lobbyView");
    var activeDiv  = document.getElementById("activeView");
    var gridDiv    = document.getElementById("gridContainer");
    var bannerDiv  = document.getElementById("bingoBanner");
    var overlayDiv = document.getElementById("victoryOverlay");

    /* ── phase switching ──────────────────────────────────────── */
    function showPhase(phase) {
        currentPhase = phase;
        lobbyDiv.style.display   = (phase === "LOBBY") ? "" : "none";
        activeDiv.style.display  = (phase !== "LOBBY") ? "" : "none";
        bannerDiv.style.display  = (streakFound)       ? "" : "none";
        overlayDiv.style.display = (modalShown)        ? "" : "none";
    }

    /* ── board rendering ──────────────────────────────────────── */
    function paintGrid() {
        gridDiv.innerHTML = "";
        var winIds = streakFound ? gatherStreakIds(streakFound) : {};

        for (var t = 0; t < liveTiles.length; t++) {
            var tile = liveTiles[t];
            var btn = document.createElement("button");

            /* base styling identical to the original Blazor BingoSquare */
            var base = "relative flex items-center justify-center p-1 text-center " +
                       "border border-gray-300 rounded transition-all duration-150 " +
                       "select-none min-h-[60px] text-xs leading-tight";

            var state;
            if (tile.selected) {
                state = winIds[tile.id]
                    ? "bg-amber-200 border-amber-400 text-amber-900"
                    : "bg-marked border-marked-border text-green-800";
            } else {
                state = "bg-white text-gray-700 tile-active";
            }

            var extra = tile.freeCell ? " font-bold text-sm" : "";
            btn.className = base + " " + state + extra;

            if (tile.freeCell) { btn.disabled = true; }
            btn.setAttribute("aria-pressed", String(tile.selected));
            btn.setAttribute("aria-label", tile.freeCell ? "Free space" : tile.prompt);

            /* inner label */
            var labelSpan = document.createElement("span");
            labelSpan.className = "wrap-break-word hyphens-auto";
            labelSpan.textContent = tile.prompt;
            btn.appendChild(labelSpan);

            /* check-mark for marked non-free tiles */
            if (tile.selected && !tile.freeCell) {
                var tick = document.createElement("span");
                tick.className = "absolute top-0.5 right-0.5 text-green-600 text-xs";
                tick.textContent = "\u2713";
                btn.appendChild(tick);
            }

            /* click handler (closure over tile id) */
            btn.addEventListener("click", (function (cid) {
                return function () { onTileTapped(cid); };
            })(tile.id));

            gridDiv.appendChild(btn);
        }
    }

    /* ── tile tap logic ───────────────────────────────────────── */
    function onTileTapped(cellId) {
        liveTiles = flipTile(liveTiles, cellId);

        if (!streakFound) {
            var detected = scanForStreak(liveTiles);
            if (detected) {
                streakFound = detected;
                currentPhase = "VICTORY";
                modalShown = true;
            }
        }
        persistSnapshot();
        paintGrid();
        bannerDiv.style.display  = streakFound ? "" : "none";
        overlayDiv.style.display = modalShown  ? "" : "none";
    }

    /* ── board manipulation (mirrors BoardAssembler.java) ─────── */
    function flipTile(board, cellId) {
        return board.map(function (c) {
            if (c.id === cellId && !c.freeCell) {
                return { id: c.id, prompt: c.prompt, selected: !c.selected, freeCell: false };
            }
            return c;
        });
    }

    /* ── victory scanning (mirrors detectWinningStreak) ───────── */
    function scanForStreak(board) {
        var r, c, positions, i;

        /* rows */
        for (r = 0; r < SIDE; r++) {
            positions = [];
            for (c = 0; c < SIDE; c++) { positions.push(r * SIDE + c); }
            if (lineComplete(board, positions)) {
                return { direction: "row", index: r, cellPositions: positions };
            }
        }

        /* columns */
        for (c = 0; c < SIDE; c++) {
            positions = [];
            for (r = 0; r < SIDE; r++) { positions.push(r * SIDE + c); }
            if (lineComplete(board, positions)) {
                return { direction: "column", index: c, cellPositions: positions };
            }
        }

        /* main diagonal */
        positions = [];
        for (i = 0; i < SIDE; i++) { positions.push(i * SIDE + i); }
        if (lineComplete(board, positions)) {
            return { direction: "diagonal", index: 0, cellPositions: positions };
        }

        /* anti diagonal */
        positions = [];
        for (i = 0; i < SIDE; i++) { positions.push(i * SIDE + (SIDE - 1 - i)); }
        if (lineComplete(board, positions)) {
            return { direction: "diagonal", index: 1, cellPositions: positions };
        }

        return null;
    }

    function lineComplete(board, positions) {
        for (var k = 0; k < positions.length; k++) {
            if (!board[positions[k]].selected) { return false; }
        }
        return true;
    }

    function gatherStreakIds(streak) {
        var lookup = {};
        for (var j = 0; j < streak.cellPositions.length; j++) {
            lookup[streak.cellPositions[j]] = true;
        }
        return lookup;
    }

    /* ── localStorage persistence ─────────────────────────────── */
    function persistSnapshot() {
        try {
            var blob = JSON.stringify({
                phase: currentPhase,
                tiles: liveTiles,
                streak: streakFound,
                modal: modalShown
            });
            localStorage.setItem(PERSIST_KEY, blob);
        } catch (_) { /* storage full or unavailable */ }
    }

    function restoreSnapshot() {
        try {
            var raw = localStorage.getItem(PERSIST_KEY);
            if (!raw) { return false; }
            var snap = JSON.parse(raw);
            if (!snap.tiles || snap.tiles.length !== TOTAL_CELLS) { return false; }
            liveTiles   = snap.tiles;
            streakFound = snap.streak || null;
            modalShown  = !!snap.modal;
            currentPhase = snap.phase || "ACTIVE";
            return currentPhase !== "LOBBY";
        } catch (_) { return false; }
    }

    /* ── public API (called from onclick attrs) ───────────────── */
    window.launchGame = function () {
        fetch("/api/bingo/fresh-board")
            .then(function (resp) { return resp.json(); })
            .then(function (cells) {
                liveTiles   = cells;
                streakFound = null;
                modalShown  = false;
                currentPhase = "ACTIVE";
                persistSnapshot();
                paintGrid();
                showPhase("ACTIVE");
            });
    };

    window.retreatToLobby = function () {
        liveTiles   = [];
        streakFound = null;
        modalShown  = false;
        currentPhase = "LOBBY";
        persistSnapshot();
        showPhase("LOBBY");
    };

    window.dismissVictoryModal = function () {
        modalShown = false;
        overlayDiv.style.display = "none";
        persistSnapshot();
    };

    /* ── boot ─────────────────────────────────────────────────── */
    if (restoreSnapshot()) {
        paintGrid();
        showPhase(currentPhase);
    } else {
        showPhase("LOBBY");
    }
})();
</script>

</body>
</html>
